  <style>
    :root { --bg: #f6f4ef; --text: #161616; --muted: #555; --link: #161616; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141414; --text: #f2f0ea; --muted: #b5b5b5; --link: #f2f0ea; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 2rem 1.25rem;
    }
    main { max-width: 34rem; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; margin: 0 0 1rem; letter-spacing: -0.02em; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; }
    a { color: var(--link); text-underline-offset: 0.2em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  </style>
</head>
